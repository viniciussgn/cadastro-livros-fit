services:
  banco:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: livros_user
      POSTGRES_PASSWORD: livros_senha
      POSTGRES_DB: livros_db
    ports:
      - "5432:5432"
    volumes:
      - dados_banco:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: always
    environment:
      DATABASE_URL: "postgresql://livros_user:livros_senha@banco:5432/livros_db"
    ports:
      - "3000:3000"
    depends_on:
      - banco
    volumes:
      - uploads_livros:/app/uploads

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  dados_banco:
  uploads_livros: